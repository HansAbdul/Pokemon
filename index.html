<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Pokemon</title>
    </head>

    <body>
        <header>
            
                <img src="Pokemon.png" alt="Pokemon logo"/>
            

            <p>Build your ultimate team!</p>
        </header>

        <main>
            <section>
                <h2>Search pokemon</h2>
                <input
                    type="text"
                    id="pokemon-search-button"
                    placeholder="Enter Pokemon name"
                    role="combobox"
                    aria-label="Search Pokemon by name"
                    aria-autocomplete="list"
                    aria-expanded="false"
                    aria-controls="suggestions"
                    autocomplete="off"
                />
                <button id="search" class="btn btn-search">Search</button>
                <p id="search-status" role="status" aria-live="polite"></p>
                <button id="retry" class="btn" hidden>Retry</button>
                <div id="suggest-wrap">
                <ul id="suggestions" role="listbox" aria-label="Pokemon suggestions" hidden></ul>
                <div id="preview" hidden></div>
                </div>
                <div id="Pokemonresult" aria-live="polite"></div>
            </section>

            <section>
                <h2>Your team</h2>
                <div id="Team"></div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
